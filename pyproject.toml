[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Reproducible Mistral FP16 versus AWQ serving experiments"
requires-python = ">=3.11,<3.13"
dependencies = ["aiohttp==3.13.3", "numpy==2.2.6", "matplotlib==3.10.8"]

[project.optional-dependencies]
gpu = [
  "torch==2.9.1", "vllm==0.15.1", "llmcompressor==0.9.0",
  "compressed-tensors==0.13.0", "transformers==4.57.3",
  "datasets==4.4.1", "accelerate==1.12.0", "huggingface-hub==0.36.0",
  "tokenizers==0.22.1", "safetensors==0.7.0", "sentencepiece==0.2.1",
]
dev = ["pytest==9.0.2", "ruff==0.14.14", "nbformat==5.10.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
